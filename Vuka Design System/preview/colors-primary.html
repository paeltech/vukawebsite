<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Primary Colours" subtitle="Ember · Parchment · Vuka Black" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Codec Pro', sans-serif; background: #F5EFE6; padding: 28px 32px; display: flex; gap: 0; height: 180px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; position: relative; }
  .swatch:first-child { border-radius: 4px 0 0 4px; }
  .swatch:last-child { border-radius: 0 4px 4px 0; }
  .name { font-weight: 700; font-size: 13px; letter-spacing: 0; line-height: 1.2; margin-bottom: 4px; }
  .hex  { font-weight: 300; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
  .role { font-weight: 300; font-size: 10px; letter-spacing: 0.1em; margin-top: 6px; opacity: 0.6; }
  .ember    { background: #C4581C; color: #F5EFE6; }
  .parchment{ background: #F5EFE6; color: #1A1008; border: 1.5px solid #D4C4A8; }
  .black    { background: #1A1008; color: #F5EFE6; }
</style>
</head>
<body>
  <div class="swatch ember">
    <div class="name">Vuka Ember</div>
    <div class="hex">#C4581C</div>
    <div class="role">Accent · CTAs · Logo mark</div>
  </div>
  <div class="swatch parchment">
    <div class="name">Vuka Parchment</div>
    <div class="hex">#F5EFE6</div>
    <div class="role">Primary background</div>
  </div>
  <div class="swatch black">
    <div class="name">Vuka Black</div>
    <div class="hex">#1A1008</div>
    <div class="role">Wordmark · Body text</div>
  </div>
</body>
</html>
