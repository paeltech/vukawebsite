<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colour Combinations" subtitle="Default · Bold/Statement · Dark/Prestige" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Codec Pro', sans-serif; display: flex; gap: 0; height: 200px; }
  .combo { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 22px 24px; }
  .label { font-weight: 300; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
  .title { font-weight: 900; font-size: 22px; letter-spacing: -0.02em; margin-top: 8px; line-height: 1.1; }
  .sub   { font-weight: 300; font-size: 12px; letter-spacing: 0.08em; opacity: 0.65; margin-top: 4px; }
  .accent-dot { color: #C4581C; }

  .default    { background: #F5EFE6; color: #1A1008; }
  .bold       { background: #C4581C; color: #F5EFE6; }
  .prestige   { background: #3D2B0E; color: #F5EFE6; }
  .prestige .accent-dot { color: #C4581C; }
  .bold .accent-dot { color: #F5EFE6; opacity: 0.5; }
</style>
</head>
<body>
  <div class="combo default">
    <div class="label">Default</div>
    <div>
      <div class="title">vuka<span class="accent-dot">.</span></div>
      <div class="sub">Parchment · Black · Ember</div>
    </div>
  </div>
  <div class="combo bold">
    <div class="label">Bold / Statement</div>
    <div>
      <div class="title">vuka<span class="accent-dot">.</span></div>
      <div class="sub">Ember · Parchment</div>
    </div>
  </div>
  <div class="combo prestige">
    <div class="label">Dark / Prestige</div>
    <div>
      <div class="title">vuka<span class="accent-dot">.</span></div>
      <div class="sub">Deep Soil · Parchment · Ember</div>
    </div>
  </div>
</body>
</html>
