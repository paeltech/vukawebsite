<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Lockups" subtitle="Full lockup on Default · Bold · Prestige backgrounds" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Codec Pro', sans-serif; display: flex; gap: 0; height: 220px; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; }
  .panel-label { font-weight: 300; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
  .logo { width: 120px; height: auto; }
  .default  { background: #F5EFE6; }
  .ember    { background: #C4581C; }
  .prestige { background: #3D2B0E; }
</style>
</head>
<body>
  <div class="panel default">
    <img class="logo" src="../assets/logo-default.svg" alt="Vuka logo — default">
    <div class="panel-label" style="color:#8B5A2B;">Default</div>
  </div>
  <div class="panel ember">
    <img class="logo" src="../assets/logo-parchment.svg" alt="Vuka logo — parchment">
    <div class="panel-label" style="color:#F5EFE6;">Bold / Statement</div>
  </div>
  <div class="panel prestige">
    <img class="logo" src="../assets/logo-parchment.svg" alt="Vuka logo — prestige">
    <div class="panel-label" style="color:#8B5A2B;">Dark / Prestige</div>
  </div>
</body>
</html>
