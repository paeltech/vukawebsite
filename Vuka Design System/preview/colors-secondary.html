<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Secondary Colours" subtitle="Deep Soil · Baobab · Sand · Rift Green" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Codec Pro', sans-serif; background: #F5EFE6; padding: 28px 32px; display: flex; gap: 0; height: 180px; }
  .swatch { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; position: relative; }
  .swatch:first-child { border-radius: 4px 0 0 4px; }
  .swatch:last-child  { border-radius: 0 4px 4px 0; }
  .name { font-weight: 700; font-size: 13px; line-height: 1.2; margin-bottom: 4px; }
  .hex  { font-weight: 300; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.75; }
  .role { font-weight: 300; font-size: 10px; letter-spacing: 0.1em; margin-top: 6px; opacity: 0.6; }
  .deep-soil  { background: #3D2B0E; color: #F5EFE6; }
  .baobab     { background: #8B5A2B; color: #F5EFE6; }
  .sand       { background: #D4C4A8; color: #1A1008; }
  .rift-green { background: #2A4A3A; color: #D4C4A8; }
</style>
</head>
<body>
  <div class="swatch deep-soil">
    <div class="name">Deep Soil</div>
    <div class="hex">#3D2B0E</div>
    <div class="role">Dark backgrounds · Decks</div>
  </div>
  <div class="swatch baobab">
    <div class="name">Baobab</div>
    <div class="hex">#8B5A2B</div>
    <div class="role">Mid-tone · Charts</div>
  </div>
  <div class="swatch sand">
    <div class="name">Sand</div>
    <div class="hex">#D4C4A8</div>
    <div class="role">Muted fills · Borders</div>
  </div>
  <div class="swatch rift-green">
    <div class="name">Rift Green</div>
    <div class="hex">#2A4A3A</div>
    <div class="role">Climate &amp; energy</div>
  </div>
</body>
</html>
