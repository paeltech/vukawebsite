<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Logo Marks" subtitle="Mark-only variants: Ember · Rift Green · Sand" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Codec Pro', sans-serif; background: #F5EFE6; display: flex; gap: 0; height: 200px; }
  .panel { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; }
  .panel-label { font-weight: 300; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #8B5A2B; }
  .mark { width: 64px; height: auto; }
  .parchment-bg { background: #F5EFE6; }
  .black-bg     { background: #1A1008; }
  .soil-bg      { background: #3D2B0E; }
  .green-bg     { background: #2A4A3A; }
</style>
</head>
<body>
  <div class="panel parchment-bg">
    <img class="mark" src="../assets/mark-ember.svg" alt="Vuka mark — ember">
    <div class="panel-label">Ember</div>
  </div>
  <div class="panel black-bg">
    <img class="mark" src="../assets/mark-ember.svg" alt="Vuka mark — ember on dark">
    <div class="panel-label" style="color:#D4C4A8;">Ember / Dark</div>
  </div>
  <div class="panel parchment-bg">
    <img class="mark" src="../assets/mark-riftgreen.svg" alt="Vuka mark — rift green">
    <div class="panel-label" style="color:#2A4A3A;">Rift Green</div>
  </div>
  <div class="panel soil-bg">
    <img class="mark" src="../assets/mark-sand.svg" alt="Vuka mark — sand">
    <div class="panel-label" style="color:#8B5A2B;">Sand / Soil</div>
  </div>
</body>
</html>
